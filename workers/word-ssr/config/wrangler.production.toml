# Production Wrangler configuration for the FULL-CORPUS Worker.
# Deploying with this config updates the named production Worker
# (fluentstellar-production) and its runtime origin/canonical behavior.
# workers.dev exposure is disabled (workers_dev = false, below). This config
# intentionally declares NO routes and NO custom domains — production domain
# behavior (attaching www.fluentstellar.com) is controlled by Cloudflare
# dashboard routes/custom-domain configuration, a separate manual cutover
# step outside this file.
name = "fluentstellar-production"
main = "../worker-dist-full/index.full.js"
compatibility_date = "2024-09-23"
no_bundle = true
# workers.dev serves indexable duplicate content and bypasses zone WAF rules.
workers_dev = false

[vars]
DEPLOYMENT_ENV = "production"
SITE_ORIGIN = "https://www.fluentstellar.com"
CANONICAL_HOST = "www.fluentstellar.com"
ENABLE_CANONICAL_HOST_REDIRECT = "false"
WORKER_LOG_LABEL = "Production word worker"

[assets]
directory = "../assets-full"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
# Selective, not global: only /records/* is routed to the Worker first (see
# the early guard in ../src/index.full.ts), which denies direct external
# access to the generated record shards while leaving every other path
# (including the Worker's own env.ASSETS.fetch() shard reads) asset-first.
# Full rationale in docs/deployment.md.
run_worker_first = ["/records/*"]
