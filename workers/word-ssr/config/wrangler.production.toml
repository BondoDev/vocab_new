# PRODUCTION-READY Wrangler configuration for the FULL-CORPUS Worker.
# This prepares the real production Worker artifact and origin/canonical
# behavior, but intentionally declares NO routes and NO custom domains.
# Deploying with this config updates only the named Worker and its
# workers.dev preview; attaching www.fluentstellar.com remains a separate,
# manual cutover step.
name = "fluentstellar-production"
main = "../worker-dist-full/index.full.js"
compatibility_date = "2024-09-23"
no_bundle = true
# workers.dev serves indexable duplicate content and bypasses zone WAF rules.
workers_dev = false

[vars]
DEPLOYMENT_ENV = "production"
SITE_ORIGIN = "https://www.fluentstellar.com"
CANONICAL_HOST = "www.fluentstellar.com"
ENABLE_CANONICAL_HOST_REDIRECT = "false"
WORKER_LOG_LABEL = "Production word worker"

[assets]
directory = "../assets-full"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
